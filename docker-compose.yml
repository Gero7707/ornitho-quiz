services:


  php:
    build: . 

    ports:
      - "8080:80" 

    volumes:
      - .:/var/www/html 

    environment:

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      APP_URL: ${APP_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      APP_ENV: ${APP_ENV}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}

    depends_on:
      - mysql 
      - mongodb

  mongodb:
    image: mongo:7
    container_name: ornitho-quiz-db
    restart: always
    ports:
      - "27018:27017"   # 27018 côté hôte pour éviter conflit avec MongoDB Windows
    volumes:
      - mongodb_data:/data/db


  mysql:
    image: mariadb:11.4 

    environment:
      
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME} 

    ports:
      - "3310:3306" 

    volumes:
      - db_data:/var/lib/mysql 

volumes:
  db_data:
  mongodb_data:
    